name: Desktop release
on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: Include the Linux x86_64 tar.gz
        type: boolean
        default: false
      build_macos:
        description: Include the signed and notarized Apple Silicon DMG
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mds-installer-release
  cancel-in-progress: false
jobs:
  check-tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the publication repository and exact version tag
        run: |
          python3 - <<'PY'
          import os
          from scripts.publish_release import identity, policy

          if os.environ['GITHUB_REPOSITORY'] != policy()['repository']:
              raise SystemExit('Use the approved publication repository in packaging/publication.json.')
          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Dispatch on the exact version tag.')
          version, _ = identity()
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Version tag mismatch.')
          PY

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml
    with:
      platform: windows

  linux:
    needs: check-tag
    if: inputs.build_linux
    uses: ./.github/workflows/desktop-packages.yml
    with:
      platform: linux

  macos:
    needs: check-tag
    if: inputs.build_macos
    uses: ./.github/workflows/desktop-packages.yml
    with:
      platform: macos
      release_candidate: true
    secrets:
      MDS_MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MDS_MAC_CERTIFICATE_P12_BASE64 }}
      MDS_MAC_CERTIFICATE_PASSWORD: ${{ secrets.MDS_MAC_CERTIFICATE_PASSWORD }}
      MDS_MAC_SIGN_IDENTITY: ${{ secrets.MDS_MAC_SIGN_IDENTITY }}
      MDS_MAC_NOTARY_APPLE_ID: ${{ secrets.MDS_MAC_NOTARY_APPLE_ID }}
      MDS_MAC_NOTARY_TEAM_ID: ${{ secrets.MDS_MAC_NOTARY_TEAM_ID }}
      MDS_MAC_NOTARY_PASSWORD: ${{ secrets.MDS_MAC_NOTARY_PASSWORD }}

  release:
    needs: [check-tag, ci, linux, macos]
    if: >-
      !cancelled() && needs.check-tag.result == 'success' && needs.ci.result == 'success' &&
      (!inputs.build_linux || needs.linux.result == 'success') &&
      (!inputs.build_macos || needs.macos.result == 'success')
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.15'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: uv sync --frozen --extra dev --extra mcp
      - run: uv run python -m scripts.validate_publication
      - run: uv run python -m scripts.publication_check --secrets
      - run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1 -Package -SkipValidation
      - run: uv run python scripts/prepare_corresponding_sources.py --bundle
      - name: Download the Linux package and checksum
        if: inputs.build_linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MaterialsDataStudio-linux-x86_64
          path: release_assets
      - name: Download the macOS DMG and checksum
        if: inputs.build_macos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MaterialsDataStudio-macos-arm64
          path: release_assets
      - name: Restore reviewed reference assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/restore_reference_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Reference assets are not ready; release remains unpublished.' }
      - name: Verify and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_LINUX: ${{ inputs.build_linux }}
          BUILD_MACOS: ${{ inputs.build_macos }}
        shell: pwsh
        run: |
          $ReleaseArgs = @('publish')
          if ($env:BUILD_LINUX -eq 'true') { $ReleaseArgs += @('--desktop', 'linux') }
          if ($env:BUILD_MACOS -eq 'true') { $ReleaseArgs += @('--desktop', 'macos') }
          uv run python scripts/publish_release.py @ReleaseArgs
