name: CI
on:
  pull_request:
  workflow_call:
    inputs:
      platform:
        description: Platform to test
        type: string
        default: linux
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        type: choice
        options: [windows, linux, macos]
        default: linux
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: '1'
jobs:
  test:
    name: test (${{ matrix.python }})
    if: github.event_name == 'pull_request' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan checks publication history once per run.
          fetch-depth: ${{ matrix.python == '3.12' && '0' || '1' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.15'
          enable-cache: true
          cache-suffix: py${{ matrix.python }}
      - run: uv sync --frozen --extra dev --extra mcp
      - name: Check publication files and history for secrets
        if: matrix.python == '3.12'
        run: uv run --no-sync python -m scripts.publication_check --secrets
      - name: Windows tests and coverage
        run: uv run --no-sync pytest -q --maxfail=1 --cov=materials_data_studio --cov-report=term-missing --cov-fail-under=80 -o faulthandler_timeout=120
      - run: uv run --no-sync ruff check .
        if: matrix.python == '3.12'
      - run: uv run --no-sync pyright
        if: matrix.python == '3.12'
      - run: uv run --no-sync pyright --project pyright-tests.json
        if: matrix.python == '3.12'
      - run: uv run --no-sync python scripts/build_manual.py
        if: matrix.python == '3.12'
      - run: uv run --no-sync python scripts/check_visual_performance.py
        if: matrix.python == '3.12'

  native-tests:
    name: Native tests (${{ matrix.platform }})
    if: github.event_name == 'pull_request' || inputs.platform == 'linux' || inputs.platform == 'macos'
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'ubuntu-26.04' }}
    timeout-minutes: 60
    env:
      UV_PYTHON: '3.12'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ github.event_name == 'pull_request' && fromJSON('["linux", "macos"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Windows checks the full history on PRs.
          fetch-depth: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.15'
          enable-cache: true
          cache-suffix: ${{ matrix.platform == 'macos' && 'macos-15-py3.12' || 'ubuntu-26.04-py3.12' }}
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: uv sync --frozen --extra dev --extra mcp
      - name: Check publication files and history
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python -m scripts.publication_check
      - name: Linux tests and coverage
        if: runner.os == 'Linux'
        run: uv run --no-sync pytest -q --maxfail=1 --cov=materials_data_studio --cov-report=term-missing --cov-fail-under=80 -o faulthandler_timeout=120
      - name: macOS tests including Cocoa smoke and worker tests
        if: runner.os == 'macOS'
        run: uv run --no-sync pytest -q --maxfail=1 -o faulthandler_timeout=120
      - name: Linux lint and type checks for Linux-only runs
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync pyright
          uv run --no-sync pyright --project pyright-tests.json
      - name: Linux visual performance
        if: runner.os == 'Linux'
        run: uv run --no-sync python scripts/check_visual_performance.py --report .test-tmp/visual-performance.json
